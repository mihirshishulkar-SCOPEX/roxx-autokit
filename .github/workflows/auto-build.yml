name: 🤖 ROXX-AUTOKIT CI/CD — Build, Test & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  schedule:
    # Auto-build every 6 hours to pick up new dependencies
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force create a new release'
        type: boolean
        default: false

env:
  TOOL_NAME: roxx-autokit
  GO_VERSION: '1.21'

jobs:
  # ── BUILD ─────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            suffix: ''
          - os: linux
            arch: arm64
            suffix: ''
          - os: darwin
            arch: amd64
            suffix: ''
          - os: darwin
            arch: arm64
            suffix: ''
          - os: windows
            arch: amd64
            suffix: '.exe'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build \
            -ldflags="-s -w -X main.VERSION=$(date +%Y%m%d.%H%M)-$(git rev-parse --short HEAD)" \
            -o dist/${{ env.TOOL_NAME }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }} \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TOOL_NAME }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  # ── RELEASE ───────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.force_release == 'true')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="auto-$(date +%Y%m%d.%H%M)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "⚡ ROXX-AUTOKIT ${{ steps.version.outputs.version }}"
          body: |
            ## 🔥 ROXX-AUTOKIT Auto-Release
            
            **Generated:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
            
            ### Install
            ```bash
            # Linux/macOS (one-liner)
            curl -sL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            
            # Or download binary directly
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/roxx-autokit-linux-amd64
            chmod +x roxx-autokit-linux-amd64
            mv roxx-autokit-linux-amd64 ~/.local/bin/roxx-autokit
            ```
            
            ### What's included
            - ✅ 30+ security tools tracked
            - ✅ 8 parallel update workers
            - ✅ GitHub auto-sync
            - ✅ New tool discovery
            - ✅ Systemd daemon service
          files: |
            dist/**/*
          generate_release_notes: true
          make_latest: true

  # ── AUTO SYNC TOOL REGISTRY ───────────────────────────────────────
  sync-registry:
    name: Sync Tool Registry to GitHub
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build and generate registry
        run: |
          go mod tidy
          go build -o /tmp/roxx-autokit .
          /tmp/roxx-autokit sync || true

      - name: Check tool versions
        run: |
          echo "## Tool Version Check — $(date)" > TOOLS_STATUS.md
          echo "" >> TOOLS_STATUS.md
          
          TOOLS=(subfinder httpx nuclei ffuf dalfox gau waybackurls katana naabu dnsx)
          
          for tool in "${TOOLS[@]}"; do
            LATEST=$(curl -s "https://api.github.com/repos/projectdiscovery/$tool/releases/latest" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              2>/dev/null | jq -r '.tag_name // "unknown"' 2>/dev/null || echo "unknown")
            echo "| $tool | $LATEST |" >> TOOLS_STATUS.md
          done

      - name: Commit and push
        run: |
          git config user.email "roxx-autokit@auto.bot"
          git config user.name "ROXX-AUTOKIT Bot"
          git add -A
          git diff --staged --quiet || \
            git commit -m "🤖 auto-sync: registry update [$(date +%Y-%m-%d)]" && \
            git push || true
